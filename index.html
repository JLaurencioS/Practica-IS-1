<!DOCTYPE html> 
<html lang="es"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Practica Ingenieria de Software</title> 
<!-- Vinculamos el CSS externo --> 
<link rel="stylesheet" href="styles.css"> 

<!--fuente alternativa -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

</head> 
<body> 

 <h1 style="opacity: 0.4;">Proyecto de Equipo</h1> 
  <h2 id="team-name">Equipo Luislaorence</h2> 
 
  <!-- Sección de integrante --> 
  <div id="member-section" class="neon-card"> 
    <img id="member-photo" src="images/alumno1.png" alt="Foto Alumno">
    <span class="tooltip" id="photo-tooltip">Haz clic para ver más información</span>
    <p id="member-desc">Sanchéz Rojas Jorge Laurencio - Programador en JAVAFX.</p> 
  </div> 

  <!-- Botones de interacción debajo del card -->
  <div style="margin-top: 24px;">
    <button class="btn-outline-inverse" id="colorButton">Cambiar color de fondo</button> 
    <button class="btn-outline-inverse" id="switchButton">Mostrar siguiente integrante</button> 
  </div>
 
<div><div id="clock"></div>
<div id="toast"></div></div>

<!-- Vinculamos el archivo JS --> 
<script src="script.js"></script> 

<div id="modal" class="modal">
  <div class="modal-content">
    <span id="close-modal" class="close">&times;</span>
    <img id="modal-photo" src="images/alumno1.png" alt="Foto Alumno" style="width:120px;height:120px;border-radius:8px;margin-bottom:10px;">
    <h3 id="modal-desc" style="color: rgb(255, 255, 255);">Sanchéz Rojas Jorge Laurencio - Programador en JAVAFX.</h3>
    <p id="modal-extra">Aquí puedes agregar más detalles del alumno.</p>
  </div>
</div>
</body> 
</html>
